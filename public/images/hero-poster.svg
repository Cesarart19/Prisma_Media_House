<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1B2A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B87333;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#B87333;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B87333;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#B87333;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad1)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="1920" y2="1080"/>
    <line x1="1920" y1="0" x2="0" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="960" cy="540" r="400" fill="none" stroke="#B87333" stroke-width="0.5" opacity="0.1"/>
  <circle cx="960" cy="540" r="300" fill="none" stroke="#B87333" stroke-width="0.5" opacity="0.08"/>
  <circle cx="960" cy="540" r="200" fill="none" stroke="#B87333" stroke-width="0.5" opacity="0.05"/>
  
  <!-- Center glow -->
  <ellipse cx="960" cy="540" rx="600" ry="400" fill="url(#glow)"/>
  
  <!-- Camera icon silhouette -->
  <g transform="translate(860, 440)" opacity="0.08">
    <path d="M200,100 L40,100 L20,140 L0,140 L0,220 L200,220 L220,180 L220,140 L200,140 Z" fill="#ffffff"/>
    <circle cx="100" cy="160" r="40" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle cx="100" cy="160" r="25" fill="#ffffff"/>
  </g>
  
  <!-- Film strip decoration -->
  <g opacity="0.05" fill="#B87333">
    <rect x="50" y="200" width="60" height="40" rx="4"/>
    <rect x="50" y="260" width="60" height="40" rx="4"/>
    <rect x="50" y="320" width="60" height="40" rx="4"/>
    <rect x="50" y="380" width="60" height="40" rx="4"/>
    <rect x="50" y="440" width="60" height="40" rx="4"/>
    
    <rect x="1810" y="200" width="60" height="40" rx="4"/>
    <rect x="1810" y="260" width="60" height="40" rx="4"/>
    <rect x="1810" y="320" width="60" height="40" rx="4"/>
    <rect x="1810" y="380" width="60" height="40" rx="4"/>
    <rect x="1810" y="440" width="60" height="40" rx="4"/>
  </g>
  
  <!-- Noise texture overlay -->
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.02"/>
</svg>